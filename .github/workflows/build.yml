name: Redmi Note 8 Kernel Build

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/ikteach/ginkgo_nethunter_kernel.git
  KERNEL_BRANCH: main

  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3.git

  CLANG_REPO: https://github.com/kdrag0n/proton-clang.git

  DEFCONFIG: ginkgo_defconfig
  DEVICE: ginkgo

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update

        sudo apt install -y \
        git wget curl python3 bc bison flex zip unzip \
        build-essential cpio libssl-dev libelf-dev \
        gcc g++ make lld llvm clang

    - name: Clone Kernel
      run: |
        git clone --depth=1 \
        -b $KERNEL_BRANCH \
        $KERNEL_REPO kernel

    - name: Clone Proton Clang
      run: |
        git clone --depth=1 \
        $CLANG_REPO clang

    - name: Integrate KernelSU Next
      working-directory: kernel
      run: |
        curl -LSs https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh | bash -s dev

    - name: Integrate SUSFS
      working-directory: kernel
      run: |

        git clone --depth=1 \
        https://github.com/sidex15/susfs4ksu.git susfs

        cp -r susfs/kernel_patches/* .

        bash susfs/kernel_patches/50_add_susfs_in_kernel-5.4.sh

    - name: Configure Kernel
      working-directory: kernel
      env:
        PATH: ${{ github.workspace }}/clang/bin:${PATH}
      run: |
        make O=out \
        ARCH=arm64 \
        CC=clang \
        LLVM=1 \
        LLVM_IAS=1 \
        $DEFCONFIG

    - name: Build Kernel
      working-directory: kernel
      env:
        PATH: ${{ github.workspace }}/clang/bin:${PATH}
      run: |

        make -j$(nproc) \
        O=out \
        ARCH=arm64 \
        CC=clang \
        LLVM=1 \
        LLVM_IAS=1 \
        CROSS_COMPILE=aarch64-linux-gnu- \
        CROSS_COMPILE_ARM32=arm-linux-gnueabi-

    - name: Clone AnyKernel3
      run: |
        git clone --depth=1 \
        $ANYKERNEL_REPO AnyKernel3

    - name: Package Zip
      run: |

        cp kernel/out/arch/arm64/boot/Image.gz-dtb \
        AnyKernel3/

        cd AnyKernel3

        zip -r9 RedmiNote8-KernelSU-Next-SUSFS.zip *

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedmiNote8-Kernel
        path: AnyKernel3/*.zip

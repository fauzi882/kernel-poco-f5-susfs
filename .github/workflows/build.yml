name: Test POCO F5 Marble

on:
workflow_dispatch:

jobs:
test:
runs-on: ubuntu-22.04

steps:
  - name: Checkout Marble Kernel
    uses: actions/checkout@v5
    with:
      repository: Pzqqt/android_kernel_xiaomi_marble
      ref: melt-rebase
      fetch-depth: 1

  - name: Show Kernel Source
    run: |
      echo "Repository:"
      git remote -v
      echo
      echo "Commit:"
      git rev-parse HEAD
      echo
      echo "Files:"
      ls -lah
      echo
      echo "Defconfig:"
      ls arch/arm64/configs/ | grep marble

  - name: Install Dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        bc \
        bison \
        build-essential \
        flex \
        git \
        libelf-dev \
        libncurses-dev \
        libssl-dev \
        python3 \
        rsync

  - name: Configure Kernel
    run: |
      export ARCH=arm64

      mkdir -p out

      make O=out marble_defconfig

      echo
      echo "Kernel configuration generated."
      echo
      grep -E \
        "CONFIG_ARM64|CONFIG_LTO_CLANG|CONFIG_CFI" \
        out/.config || true

  - name: Test Build
    run: |
      export ARCH=arm64

      make \
        -j2 \
        O=out \
        Image.gz \
        2>&1 | tee build.log

  - name: Upload Build Log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: marble-build-log
      path: build.log
      if-no-files-found: ignore

  - name: Upload Kernel
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: marble-kernel-test
      path: |
        out/arch/arm64/boot/Image
        out/arch/arm64/boot/Image.gz
        out/.config
      if-no-files-found: warn

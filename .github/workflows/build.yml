name: Build Custom Kernel (Marble + KSU Next)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment (Pinjam Server)
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc x11proto-core-dev libx11-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3 libncurses-dev

      - name: Clone Toolchain (Mesin Kompilasi Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel Source (Pondasi Kernel)
        # Nanti link ini kita ganti dengan source yang paling pas buat Android 16 lu
        run: |
          git clone --depth=1 https://github.com/PARADOX-X20/kernel_xiaomi_marble.git kernel-source

            - name: Suntik KernelSU Next & SuSFS
        run: |
          cd kernel-source
          
          echo "Menyedot KernelSU Next resmi..."
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          
          echo "Memasukkan KSU Next ke dalam urat nadi kernel..."
          cp -r KernelSU-Next/kernel drivers/kernelsu
          
          echo "Menambahkan KSU ke sistem build (Kconfig & Makefile)..."
          echo 'source "drivers/kernelsu/Kconfig"' >> arch/arm64/configs/Kconfig
          sed -i '/obj-y += char\//a obj-y += kernelsu\/' drivers/Makefile
          
          echo "Menyedot bahan baku SuSFS..."
          git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs-bahan
          
          echo "Menyuntikkan Patch SuSFS ke KernelSU dan Kernel..."
          cp susfs-bahan/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch drivers/kernelsu/
          cd drivers/kernelsu
          patch -p1 < 10_enable_susfs_for_ksu.patch
          cd ../../
          
          echo "Menambahkan hooks SuSFS ke sistem..."
          cp susfs-bahan/kernel_patches/50_add_susfs_in_kernel-5.10.patch .
          patch -p1 < 50_add_susfs_in_kernel-5.10.patch || echo "Patch kernel mungkin butuh penyesuaian manual di PARADOX, kita lanjut dulu!"
          
          echo "Suntikan selesai, bersihkan sisa bahan..."
          rm -rf KernelSU-Next susfs-bahan
          cd ..
          

      - name: Proses Compile Kernel (Masak!)
        run: |
          cd kernel-source
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          
          # marble_defconfig adalah racikan standar buat POCO F5
          make O=out vendor/marble_defconfig
          make -j$(nproc --all) O=out

      - name: Bungkus pakai AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 ../CustomKernel-Marble.zip *

      - name: Upload Hasil Akhir (File ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: CustomKernel-Marble-Siap-Flash
          path: CustomKernel-Marble.zip
          
